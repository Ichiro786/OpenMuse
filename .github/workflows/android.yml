name: Android

# A debug APK (arm64-v8a) for every push and pull request that touches the
# Android tree. Debug-signed only: no keystore and no secrets are involved;
# release builds happen on a developer machine with scripts/release-apk.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NDK_VERSION: 30.0.16248370 # nanoMuse: current LTS, with 16 KB ELF alignment by default.

jobs:
  # The path filter is a job, not `on.push.paths`, so the build is reported as skipped rather
  # than absent when the Android tree is untouched: branch protection requires this check,
  # and a check that never reports would block every docs-only pull request.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - "android/**"
              - "scripts/android/**"
              - "scripts/rebrand.py"
              - "scripts/gen-android-icons.py"
              - ".github/workflows/android.yml"

  debug-apk:
    name: debug APK · arm64-v8a
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # android/deps/proot (our fork)

      # nanoMuse: binary-format fixtures need neither Gradle nor the Android SDK.
      - name: Native alignment checker tests
        run: python3 -m unittest discover -s scripts/android/tests -p 'test_*.py'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v7
        with:
          # gomobile@latest wants the current Go; GOTOOLCHAIN=auto below lets `go` fetch a
          # newer one when it asks for it (setup-go v6+ pins the toolchain otherwise).
          go-version: "1.26"
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;${{ env.NDK_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Native artifacts (proot, Alpine rootfs, rclone.aar)
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export GOROOT="$(go env GOROOT)" GOPATH="$(go env GOPATH)"
          export PATH="$GOPATH/bin:$PATH" # gomobile / gobind land there
          bash scripts/android/build-natives.sh

      - name: assembleDebug
        id: assemble
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      # Our unit tests (io.github.nanomuse.*: the guards, the hub client, the sandbox paths, the
      # strings' parity), plus chat regression tests; the compiled classes are warm.
      - name: Unit tests
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:testDebugUnitTest --tests 'io.github.nanomuse.*' --tests 'com.openminis.app.ui.chat.*' --console=plain --no-daemon

      - name: Android lint
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        working-directory: android/src/android
        run: ./gradlew :app:lintDebug --console=plain --no-daemon

      # nanoMuse: validate the actual installable file before publishing it.
      - name: APK integrity, native alignment, signature and badging
        id: apk-checks
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk="android/src/android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$apk" | tail -1
          "$bt/apksigner" verify --verbose --print-certs "$apk"
          "$bt/aapt" dump badging "$apk" | grep -E "^package:|application-label:|native-code"
          "$bt/zipalign" -c -P 16 -v 4 "$apk"
          # nanoMuse: only the exact pinned ARM32 guest loader remains an explicit upstream warning.
          python3 scripts/android/check-native-alignment.py "$apk" --allow-legacy-proot32
          sha256sum "$apk"

      # nanoMuse: a direct APK avoids an outer ZIP that phone archive managers may reject.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.apk-checks.outcome == 'success' }}
        with:
          archive: false
          path: android/src/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Compile instrumentation tests
        id: instrumentation-compile
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        working-directory: android/src/android
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain --no-daemon
