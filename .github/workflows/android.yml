name: Android

# A debug APK (arm64-v8a) for every push and pull request that touches the
# Android tree. Debug-signed only: no keystore and no secrets are involved;
# release builds happen on a developer machine with scripts/release-apk.sh.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NDK_VERSION: 30.0.16248370 # nanoMuse: current LTS, with 16 KB ELF alignment by default.

jobs:
  # The path filter is a job, not `on.push.paths`, so the build is reported as skipped rather
  # than absent when the Android tree is untouched: branch protection requires this check,
  # and a check that never reports would block every docs-only pull request.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - "android/**"
              - "scripts/android/**"
              - "scripts/rebrand.py"
              - "scripts/gen-android-icons.py"
              - ".github/workflows/android.yml"

  debug-apk:
    name: debug APK · arm64-v8a
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # android/deps/proot (our fork)

      # nanoMuse: binary-format fixtures need neither Gradle nor the Android SDK.
      - name: Native alignment checker tests
        run: python3 -m unittest discover -s scripts/android/tests -p 'test_*.py'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-go@v7
        with:
          # gomobile@latest wants the current Go; GOTOOLCHAIN=auto below lets `go` fetch a
          # newer one when it asks for it (setup-go v6+ pins the toolchain otherwise).
          go-version: "1.26"
          cache-dependency-path: android/deps/rclone-mobile/go.sum

      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-36 build-tools;35.0.0 cmake;3.22.1 ndk;${{ env.NDK_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Native artifacts (proot, Alpine rootfs, rclone.aar)
        env:
          GOTOOLCHAIN: auto
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export GOROOT="$(go env GOROOT)" GOPATH="$(go env GOPATH)"
          export PATH="$GOPATH/bin:$PATH" # gomobile / gobind land there
          bash scripts/android/build-natives.sh

      - name: assembleDebug
        id: assemble
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      # nanoMuse: include browser regressions without coupling them to device-test compilation.
      - name: Unit tests
        working-directory: android/src/android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./gradlew :app:testDebugUnitTest \
            --tests 'io.github.nanomuse.*' \
            --tests 'com.openminis.app.browser.*' \
            --tests 'com.openminis.app.ui.browser.*' \
            --tests 'com.openminis.app.ui.chat.*' \
            --console=plain --no-daemon

      - name: Android lint
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        working-directory: android/src/android
        run: ./gradlew :app:lintDebug --console=plain --no-daemon

      - name: Archive lint reports
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            android/src/android/app/build/reports/lint-results-debug.html
            android/src/android/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

      # nanoMuse: validate the actual installable file before publishing it.
      - name: APK integrity, native alignment, signature and badging
        id: apk-checks
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk="android/src/android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$apk" | tail -1
          "$bt/apksigner" verify --verbose --print-certs "$apk"
          "$bt/aapt" dump badging "$apk" | grep -E "^package:|application-label:|native-code"
          "$bt/zipalign" -c -P 16 -v 4 "$apk"
          # nanoMuse: only the exact pinned ARM32 guest loader remains an explicit upstream warning.
          python3 scripts/android/check-native-alignment.py "$apk" --allow-legacy-proot32
          sha256sum "$apk"

          # nanoMuse: inspect the packaged ARM64 library, not an intermediate host build.
          nm_llvm="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          nm_jni="$RUNNER_TEMP/nanomuse-download-arm64.so"
          unzip -p "$apk" lib/arm64-v8a/libpty_bridge.so > "$nm_jni"
          "$nm_llvm/llvm-readelf" --file-header "$nm_jni" | grep -E 'Machine:.*AArch64'
          "$nm_llvm/llvm-nm" --dynamic --defined-only "$nm_jni" | \
            grep -E ' T Java_io_github_nanomuse_browser_BrowserDownloadNative_renameNoReplace$'

      # nanoMuse: a direct APK avoids an outer ZIP that phone archive managers may reject.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.apk-checks.outcome == 'success' }}
        with:
          archive: false
          path: android/src/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      # nanoMuse: report stale device-test failures without hiding independent JVM, lint, or JNI results.
      - name: Compile instrumentation tests
        id: instrumentation-compile
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        working-directory: android/src/android
        run: ./gradlew :app:compileDebugAndroidTestKotlin --console=plain --no-daemon

      # nanoMuse: keep the published APK ARM64; x86_64 runs the F02 instrumentation on API 35.
      - name: Download security instrumentation (API 35, x86_64, enforcing SELinux)
        if: \${{ !cancelled() && steps.instrumentation-compile.outcome == 'success' }}
        working-directory: android/src/android
        timeout-minutes: 20
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u)" /dev/kvm
          # avdmanager and emulator must use the same runner XDG-based AVD directory.
          export ANDROID_USER_HOME="${ANDROID_USER_HOME:-${XDG_CONFIG_HOME:-$HOME/.config}/.android}"
          export ANDROID_AVD_HOME="${ANDROID_AVD_HOME:-$ANDROID_USER_HOME/avd}"
          sdkmanager --install "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          avdmanager create avd --force --name nm-f02 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2"
          if ! "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fxq nm-f02; then
            echo "AVD nm-f02 was not created"
            avdmanager list avd || true
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd nm-f02 -no-window -gpu swiftshader \
            -no-audio -no-boot-anim -no-snapshot -accel on \
            > app/build/f02-emulator.log 2>&1 &
          nm_emulator_pid=$!
          nm_collect_diagnostics() {
            echo "=== emulator startup diagnostics ==="
            uname -a
            nproc
            free -h || true
            df -h "$ANDROID_HOME" || true
            "$ANDROID_HOME/emulator/emulator" -accel-check || true
            "$ANDROID_HOME/emulator/emulator" -list-avds || true
            adb devices -l || true
            if [ -n "$nm_emulator_pid" ]; then
              ps -o pid,stat,cmd -p "$nm_emulator_pid" || true
            fi
            echo "=== emulator log (last 250 lines) ==="
            tail -n 250 app/build/f02-emulator.log || true
            timeout 15s adb logcat -b all -d > app/build/f02-logcat.txt 2>&1 || true
            echo "=== logcat (last 200 lines) ==="
            tail -n 200 app/build/f02-logcat.txt || true
          }
          nm_finish() {
            nm_status=$?
            trap - EXIT
            if [ "$nm_status" -ne 0 ]; then
              nm_collect_diagnostics
            else
              timeout 15s adb logcat -b all -d > app/build/f02-logcat.txt 2>&1 || true
            fi
            kill "$nm_emulator_pid" 2>/dev/null || true
            exit "$nm_status"
          }
          trap nm_finish EXIT
          nm_elapsed=0
          while [ "$nm_elapsed" -lt 240 ]; do
            if ! kill -0 "$nm_emulator_pid" 2>/dev/null; then
              echo "Emulator process exited before ADB connected"
              exit 1
            fi
            if adb devices | grep -Eq '^emulator-[0-9]+[[:space:]]+device$'; then
              break
            fi
            sleep 2
            nm_elapsed=$((nm_elapsed + 2))
          done
          if [ "$nm_elapsed" -ge 240 ]; then
            echo "Timed out waiting for ADB to connect to the emulator"
            exit 1
          fi
          if ! timeout 240s bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done'; then
            echo "Emulator connected to ADB but did not complete boot"
            exit 1
          fi
          test "$(adb shell getenforce | tr -d '\r')" = Enforcing
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew -Pnm.abi=x86_64 :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=io.github.nanomuse.browser.BrowserDownloadFilesInstrumentedTest,io.github.nanomuse.browser.BrowserDownloadIntegrationTest \
            --console=plain --no-daemon

      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-verification-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            android/src/android/app/build/reports/tests/
            android/src/android/app/build/test-results/
            android/src/android/app/build/reports/lint-results-debug.*
            android/src/android/app/build/reports/androidTests/
            android/src/android/app/build/outputs/androidTest-results/
            android/src/android/app/build/f02-emulator.log
            android/src/android/app/build/f02-logcat.txt
